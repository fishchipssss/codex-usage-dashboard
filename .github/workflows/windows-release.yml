name: Windows portable release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -B -m unittest discover -s tests -v
      - run: python -m pip install pyinstaller==6.20.0
      - run: python tools/build_windows.py
      - run: python tools/smoke_windows.py dist/CodexUsageDashboard.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CodexUsageDashboard-Windows-x64
          path: |
            dist/CodexUsageDashboard.exe
            dist/CodexUsageDashboard-Windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Publish tested Windows binaries
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist/CodexUsageDashboard.exe dist/CodexUsageDashboard-Windows-x64.zip dist/SHA256SUMS.txt --verify-tag --title "Codex Usage Dashboard $env:GITHUB_REF_NAME" --notes-file docs/RELEASE-v0.3.0.md
